[dependencies]

[package]
  cjc-version = "1.1.3"
  name = "lanchat"
  description = "WiFi LAN chat system written in Cangjie"
  version = "1.0.0"
  output-type = "executable"
  src-dir = "./src"
  # 若使用 stdx 静态库并涉及 crypto/net，Windows 需追加 "-lcrypt32"
  compile-option = ""
  link-option = ""

# 使用与 cjc 1.1.3 匹配的 stdx 1.1.3.1 动态库；local-libs/ 不提交 Git。
# Linux 可在 local-libs/stdx 建立指向实际 dynamic/stdx 的链接。
[target.x86_64-unknown-linux-gnu.bin-dependencies]
  path-option = ["./local-libs/stdx"]

# Windows x64：官方 stdx 下载脚本解压到 local-libs/ 后使用此路径。
# 若 cjc -v 输出的 Target 不同，需按实际 Target 修改表名。
[target.x86_64-w64-mingw32.bin-dependencies]
  path-option = ["./local-libs/windows_x86_64_cjnative/dynamic/stdx"]
